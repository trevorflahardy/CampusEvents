services:
  postgres:
    image: postgres:16-alpine
    container_name: campusevents_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus123
      POSTGRES_DB: campusevents
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusevents_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://campus:campus123@postgres:5432/campusevents
      JWT_SECRET: campusevents-dev-secret-change-in-prod
      PORT: "3000"
    depends_on:
      - postgres
    volumes:
      - uploads_data:/app/uploads
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: app/src
          ignore:
            - ./backend/node_modules/
        - action: rebuild
          path: ./backend/package.json

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusevents_web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:3000
      VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN}
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: app/src
          ignore:
            - ./frontend/node_modules/
        - action: rebuild
          path: ./frontend/package.json

volumes:
  postgres_data:
  uploads_data:
