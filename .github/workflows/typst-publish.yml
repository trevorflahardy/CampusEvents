name: Compile and Publish Typst

on:
  push:
    branches: [main]
    paths:
      - "**/*.typ"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - name: Compile all Typst documents
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            output="${file%.typ}.pdf"
            echo "Compiling $file -> $output"
            typst compile "$file" "$output"
          done < <(find . -type f -name "*.typ" \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            -not -path "./client/node_modules/*" \
            -not -path "./server/node_modules/*" -print0)

      - name: Commit compiled PDFs
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- "*.pdf" ":(glob)**/*.pdf")" ]; then
            echo "No PDF changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "*.pdf" ":(glob)**/*.pdf"
          git commit -m "chore(typst): compile Typst documents"
          git push
