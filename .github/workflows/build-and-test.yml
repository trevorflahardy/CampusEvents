name: Build and Test

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "server/**"
      - ".github/workflows/build-and-test.yml"
  pull_request:
    paths:
      - "client/**"
      - "server/**"
      - ".github/workflows/build-and-test.yml"

jobs:
  client:
    name: Client Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

  server:
    name: Server Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test
